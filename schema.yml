components:
  schemas:
    ApiError:
      type: object
      description: Estructura para cualquier otro error (401, 403, 404, 500...).
      properties:
        success:
          type: boolean
          default: false
        errors:
          $ref: '#/components/schemas/ErrorsDetail'
        data:
          type: string
          default: ''
        message:
          type: string
          nullable: true
      required:
      - errors
    ApiValidationError:
      type: object
      description: Estructura para errores de validación (campos inválidos).
      properties:
        success:
          type: boolean
          default: false
        errors:
          $ref: '#/components/schemas/ErrorsValidation'
        data:
          type: string
          default: ''
        message:
          type: string
          nullable: true
      required:
      - errors
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
        confirm_new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - confirm_new_password
      - current_password
      - new_password
    DetailContext:
      type: object
      description: Contexto para errores simples (no validación).
      properties:
        detail:
          type: string
      required:
      - detail
    EmailUpdateRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    ErrorsDetail:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/DetailContext'
        code_error:
          type: string
      required:
      - code_error
      - context
    ErrorsValidation:
      type: object
      properties:
        context:
          $ref: '#/components/schemas/ValidationContext'
        code_error:
          type: string
          description: Ruta del view que generó el error
      required:
      - code_error
      - context
    Goal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        island:
          type: integer
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        frequency_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: e.g. 15 for biweekly
        start_date:
          type: string
          format: date
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - frequency_days
      - id
      - island
      - start_date
      - target_amount
      - updated_at
    GoalRequest:
      type: object
      properties:
        island:
          type: integer
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        frequency_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: e.g. 15 for biweekly
        start_date:
          type: string
          format: date
        active:
          type: boolean
      required:
      - frequency_days
      - island
      - start_date
      - target_amount
    GoogleIDTokenRequest:
      type: object
      properties:
        access_token:
          type: string
        code:
          type: string
        id_token:
          type: string
          minLength: 1
      required:
      - id_token
    PaginatedGoalList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Goal'
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedGoalRequest:
      type: object
      properties:
        island:
          type: integer
        target_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        frequency_days:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: e.g. 15 for biweekly
        start_date:
          type: string
          format: date
        active:
          type: boolean
    SetNewPasswordRequest:
      type: object
      properties:
        uidb64:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 6
        confirm_new_password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - confirm_new_password
      - new_password
      - token
      - uidb64
    TokenBlacklistRequest:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    TokenVerifyRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - token
    UserCreateRequest:
      type: object
      description: Serializer para creación de usuarios con contraseña
      properties:
        username:
          type: string
          minLength: 1
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 1
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - confirm_password
      - email
      - password
      - username
    ValidationContext:
      type: object
      description: |-
        Contexto de errores de validación DRF.
        Los keys son los campos del serializer que fallaron.
      properties:
        username:
          type: array
          items:
            type: string
        field_name:
          type: array
          items:
            type: string
          description: Representa cualquier campo del serializer (email, password,
            etc.)
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: auth
  description: Autenticación, providers y tokens JWT
- name: users
  description: Gestión de usuarios
- name: goals
  description: Gestion de objetivos
